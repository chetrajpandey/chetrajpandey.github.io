{% assign research = include.item %}<a class="research-card" href="{{ research.url | relative_url }}"><img class="research-illustration" src="{{ research.image | relative_url }}" alt="{{ research.image_alt | escape }}" width="600" height="300" loading="lazy"><div class="card-top"><span class="eyebrow">{{ research.label | escape }}</span></div><h3>{{ research.title | escape }}</h3><p>{{ research.short | escape }}</p><span class="card-link">Read more {% include link-arrow.html %}</span></a>
