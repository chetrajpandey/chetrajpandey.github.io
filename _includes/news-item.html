{% assign n = include.item %}<article class="news-item" data-category="{{ n.category | escape }}"><div><time datetime="{{ n.date | escape }}">{% include date.html value=n.date %}</time><span class="news-category">{{ n.category | escape }}</span></div><div><h3>{{ n.title | escape }}</h3><p>{{ n.text | escape }}</p>{% if n.url != '' %}{% include link.html url=n.url label='Read more' %}{% endif %}</div></article>
